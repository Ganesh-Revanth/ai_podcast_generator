version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ainews_postgres
    environment:
      POSTGRES_USER: ainews_user
      POSTGRES_PASSWORD: ainews_password
      POSTGRES_DB: ainews_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
